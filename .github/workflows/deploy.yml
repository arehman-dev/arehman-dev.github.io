name: Deploy Astro Site to Pages

on:
  push:
    branches: [ "main" ] # Triggers on pushes to the main branch
  workflow_dispatch:     # Allows manual trigger from the GitHub Actions tab

# Set permissions for GITHUB_TOKEN to allow deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments running at the same time
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro Static Site
        run: npm run build

      - name: Upload Build Output Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
