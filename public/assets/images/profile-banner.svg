<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="75%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020408" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan-glow" cx="25%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#020408" stop-opacity="0" />
    </radialGradient>

    <!-- Isometric Face Gradients -->
    <linearGradient id="iso-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="iso-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="iso-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emerald-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulse-signal {
      0%, 100% { opacity: 0.35; r: 3.5; }
      50% { opacity: 1; r: 5; }
    }
    @keyframes bus-dash {
      to { stroke-dashoffset: -28; }
    }
    .term-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Monaco, Consolas, monospace;
      font-size: 13.5px;
      letter-spacing: -0.2px;
    }
    .term-prompt { fill: #10b981; font-weight: 700; }
    .term-cmd { fill: #f8fafc; font-weight: 600; }
    .term-dim { fill: #64748b; }
    .term-bracket { fill: #38bdf8; font-weight: 600; }
    .term-ok { fill: #10b981; font-weight: 600; }
    .term-val { fill: #e2e8f0; }
    .term-tag { fill: #94a3b8; }
    .cursor { animation: cursor-blink 1s infinite; fill: #10b981; }
    .signal-node { animation: pulse-signal 2.4s infinite ease-in-out; }
    .bus-flow { stroke-dasharray: 6 8; animation: bus-dash 2s linear infinite; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="460" rx="14" fill="#020408" />
  <rect width="1200" height="460" rx="14" fill="url(#bg-glow)" />
  <rect width="1200" height="460" rx="14" fill="url(#cyan-glow)" />

  <!-- Outer Frame Border -->
  <rect x="8" y="8" width="1184" height="444" rx="12" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Terminal Window Chrome -->
  <rect x="24" y="24" width="1152" height="412" rx="10" fill="#000000" stroke="#1e293b" stroke-width="1" />
  
  <!-- Terminal Header Bar -->
  <path d="M 24 34 A 10 10 0 0 1 34 24 L 1166 24 A 10 10 0 0 1 1176 34 L 1176 68 L 24 68 Z" fill="#090d16" stroke="#1e293b" stroke-width="0.8" />
  
  <!-- Window Controls -->
  <circle cx="48" cy="46" r="6" fill="#ef4444" opacity="0.85" />
  <circle cx="68" cy="46" r="6" fill="#eab308" opacity="0.85" />
  <circle cx="88" cy="46" r="6" fill="#10b981" opacity="0.85" />

  <!-- Window Title -->
  <text x="576" y="50" text-anchor="middle" class="term-text" font-size="12px" fill="#94a3b8">
    arehman@dev: ~/infrastructure/mesh — (posix/x86_64)
  </text>

  <!-- Header Right Telemetry Tag -->
  <g transform="translate(1010, 46)">
    <circle cx="0" cy="0" r="3.5" fill="#10b981" filter="url(#subtle-glow)" />
    <text x="12" y="4" class="term-text" font-size="11.5px" fill="#10b981" font-weight="600">WIREGUARD UP</text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="68" x2="1176" y2="68" stroke="#1e293b" stroke-width="1" />

  <!-- ==================== LEFT PANE: TERMINAL SESSION ==================== -->
  <g transform="translate(56, 110)">
    <!-- Command Prompt 1 -->
    <text x="0" y="0" class="term-text">
      <tspan class="term-prompt">arehman@dev</tspan><tspan class="term-dim">:</tspan><tspan class="term-bracket">~</tspan><tspan class="term-dim">$</tspan> <tspan class="term-cmd">systems-mesh --trace-topology --active</tspan>
    </text>

    <!-- Execution log -->
    <text x="0" y="32" class="term-text term-dim" font-size="12.5px">
      [mesh:ok] Initializing deterministic software stack verification...
    </text>

    <!-- Stack Matrix -->
    <text x="0" y="70" class="term-text">
      <tspan class="term-bracket">[01_PYTHON]</tspan> <tspan class="term-val">AsyncIO Pipelines • ThreadPool Workers • FastAPI</tspan>
    </text>
    <text x="0" y="96" class="term-text">
      <tspan class="term-bracket">[02_LINUX]</tspan>  <tspan class="term-val">Debian 12 Netinst • Docker Isolation • ip netns Lab</tspan>
    </text>
    <text x="0" y="122" class="term-text">
      <tspan class="term-bracket">[03_VISION]</tspan> <tspan class="term-val">Arabic &amp; Urdu OCR • OpenCV • 100% Tashkeel Retention</tspan>
    </text>
    <text x="0" y="148" class="term-text">
      <tspan class="term-bracket">[04_MOD_C++]</tspan><tspan class="term-val">Modern C++ (C++20) • RAII • Deterministic Core Tooling</tspan>
    </text>

    <!-- Dijkstra Quote / Philosophy -->
    <text x="0" y="196" class="term-text" fill="#64748b" font-style="italic" font-size="12.5px">
      &gt; "Simplicity is prerequisite for reliability." — Edsger W. Dijkstra
    </text>

    <!-- Command Prompt 2 with Blinking Cursor -->
    <text x="0" y="240" class="term-text">
      <tspan class="term-prompt">arehman@dev</tspan><tspan class="term-dim">:</tspan><tspan class="term-bracket">~</tspan><tspan class="term-dim">$</tspan> <tspan class="term-cmd">status --all-nodes</tspan> <tspan class="term-ok">✓ OPERATIONAL</tspan>
    </text>
    <rect x="424" y="226" width="9" height="16" class="cursor" />
  </g>

  <!-- Vertical Pane Separator -->
  <line x1="680" y1="88" x2="680" y2="416" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />

  <!-- ==================== RIGHT PANE: ISOMETRIC SYSTEMS BLUEPRINT ==================== -->
  <g transform="translate(690, 80)">
    
    <!-- Isometric Grid Floor Accent -->
    <g stroke="#1e293b" stroke-width="0.8" opacity="0.35">
      <!-- Grid lines -->
      <line x1="240" y1="280" x2="380" y2="200" />
      <line x1="160" y1="280" x2="300" y2="200" />
      <line x1="80"  y1="280" x2="220" y2="200" />
      <line x1="120" y1="210" x2="320" y2="325" />
      <line x1="180" y1="175" x2="380" y2="290" />
      <line x1="240" y1="140" x2="440" y2="255" />
    </g>

    <!-- Isometric Bus Routing Channels (Animated) -->
    <!-- Bus from Host Server to Containers -->
    <path d="M 230 145 L 340 205 L 340 260" fill="none" stroke="#10b981" stroke-width="1.8" class="bus-flow" opacity="0.85" />
    <!-- Bus from Host Server to Network Namespace -->
    <path d="M 230 145 L 120 205 L 120 260" fill="none" stroke="#38bdf8" stroke-width="1.8" class="bus-flow" opacity="0.85" />
    <!-- Cross Interconnect -->
    <path d="M 120 260 L 230 320 L 340 260" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.5" />

    <!-- === NODE 1 (TOP APEX): DEBIAN 12 HOST RUNTIME === -->
    <g transform="translate(230, 95)">
      <!-- Top Face -->
      <polygon points="0,-32 54,0 0,32 -54,0" fill="url(#iso-top)" stroke="#10b981" stroke-width="1.5" />
      <!-- Left Face -->
      <polygon points="-54,0 0,32 0,72 -54,40" fill="url(#iso-left)" stroke="#10b981" stroke-width="1.2" />
      <!-- Right Face -->
      <polygon points="0,32 54,0 54,40 0,72" fill="url(#iso-right)" stroke="#10b981" stroke-width="1.2" />
      <!-- Glowing Core Node -->
      <circle cx="0" cy="0" r="5" fill="#10b981" filter="url(#emerald-glow)" class="signal-node" />
      <!-- Node Label -->
      <rect x="-65" y="-56" width="130" height="20" rx="4" fill="#090d16" stroke="#10b981" stroke-width="1" />
      <text x="0" y="-42" text-anchor="middle" class="term-text" font-size="10.5px" fill="#10b981" font-weight="700">NODE: DEBIAN_HOST</text>
    </g>

    <!-- === NODE 2 (BOTTOM LEFT): LINUX IP NETNS LAB === -->
    <g transform="translate(120, 240)">
      <!-- Top Face -->
      <polygon points="0,-26 44,0 0,26 -44,0" fill="url(#iso-top)" stroke="#38bdf8" stroke-width="1.3" />
      <!-- Left Face -->
      <polygon points="-44,0 0,26 0,58 -44,32" fill="url(#iso-left)" stroke="#38bdf8" stroke-width="1" />
      <!-- Right Face -->
      <polygon points="0,26 44,0 44,32 0,58" fill="url(#iso-right)" stroke="#38bdf8" stroke-width="1" />
      <!-- Signal Indicator -->
      <circle cx="0" cy="0" r="4.5" fill="#38bdf8" filter="url(#subtle-glow)" class="signal-node" />
      <!-- Label -->
      <rect x="-60" y="-48" width="120" height="18" rx="3" fill="#090d16" stroke="#38bdf8" stroke-width="0.9" />
      <text x="0" y="-35" text-anchor="middle" class="term-text" font-size="10px" fill="#38bdf8" font-weight="600">VETH / IP_NETNS</text>
    </g>

    <!-- === NODE 3 (BOTTOM RIGHT): DOCKER & WIREGUARD === -->
    <g transform="translate(340, 240)">
      <!-- Top Face -->
      <polygon points="0,-26 44,0 0,26 -44,0" fill="url(#iso-top)" stroke="#10b981" stroke-width="1.3" />
      <!-- Left Face -->
      <polygon points="-44,0 0,26 0,58 -44,32" fill="url(#iso-left)" stroke="#10b981" stroke-width="1" />
      <!-- Right Face -->
      <polygon points="0,26 44,0 44,32 0,58" fill="url(#iso-right)" stroke="#10b981" stroke-width="1" />
      <!-- Signal Indicator -->
      <circle cx="0" cy="0" r="4.5" fill="#10b981" filter="url(#emerald-glow)" class="signal-node" />
      <!-- Label -->
      <rect x="-60" y="-48" width="120" height="18" rx="3" fill="#090d16" stroke="#10b981" stroke-width="0.9" />
      <text x="0" y="-35" text-anchor="middle" class="term-text" font-size="10px" fill="#10b981" font-weight="600">DOCKER / MESH</text>
    </g>

    <!-- === NODE 4 (BOTTOM APEX SINK): OCR & VISION ENGINE === -->
    <g transform="translate(230, 318)">
      <circle cx="0" cy="0" r="14" fill="#090d16" stroke="#f59e0b" stroke-width="1.4" />
      <circle cx="0" cy="0" r="5" fill="#f59e0b" filter="url(#subtle-glow)" class="signal-node" />
      <rect x="-55" y="18" width="110" height="17" rx="3" fill="#090d16" stroke="#f59e0b" stroke-width="0.8" />
      <text x="0" y="30" text-anchor="middle" class="term-text" font-size="9.5px" fill="#f59e0b" font-weight="600">VISION_PIPELINE</text>
    </g>

  </g>
</svg>