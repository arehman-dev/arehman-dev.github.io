<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Ambient Radial Glows -->
    <radialGradient id="glow-emerald" cx="80%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-blue" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Node Glow Filters -->
    <filter id="emerald-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -32; }
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Monaco, Consolas, monospace;
    }
    .cursor {
      animation: blink 1.05s infinite;
      fill: #10b981;
    }
    .pulse-core {
      animation: pulse-node 2.8s infinite ease-in-out;
      transform-origin: center;
    }
    .flow-line {
      stroke-dasharray: 4 8;
      animation: dash-flow 3s linear infinite;
    }
  </style>

  <!-- Deep OLED Canvas Background -->
  <rect width="1200" height="380" rx="12" fill="#000000" />
  <rect width="1200" height="380" rx="12" fill="url(#glow-emerald)" />
  <rect width="1200" height="380" rx="12" fill="url(#glow-blue)" />

  <!-- Outer Window Frame -->
  <rect x="16" y="16" width="1168" height="348" rx="10" fill="#030712" stroke="#1e293b" stroke-width="1.2" />

  <!-- Window Header Bar -->
  <path d="M 16 26 A 10 10 0 0 1 26 16 L 1174 16 A 10 10 0 0 1 1184 26 L 1184 56 L 16 56 Z" fill="#080d1a" stroke="#1e293b" stroke-width="0.8" />

  <!-- Window Controls -->
  <circle cx="42" cy="36" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="60" cy="36" r="5.5" fill="#eab308" opacity="0.85" />
  <circle cx="78" cy="36" r="5.5" fill="#10b981" opacity="0.85" />

  <!-- Header Title -->
  <text x="600" y="40" text-anchor="middle" class="mono" font-size="12px" fill="#64748b" letter-spacing="0.5px">
    arehman@dev: ~
  </text>

  <!-- Header Right Status -->
  <g transform="translate(1120, 36)">
    <circle cx="0" cy="0" r="3.5" fill="#10b981" filter="url(#subtle-glow)" />
    <text x="-12" y="3.5" text-anchor="end" class="mono" font-size="11px" fill="#94a3b8">online</text>
  </g>

  <!-- Divider Line -->
  <line x1="16" y1="56" x2="1184" y2="56" stroke="#1e293b" stroke-width="1" />

  <!-- ==================== LEFT: CLEAN MINIMALIST SHELL ==================== -->
  <g transform="translate(56, 115)">
    <!-- Command 1: whoami -->
    <text x="0" y="0" class="mono" font-size="15px">
      <tspan fill="#10b981" font-weight="700">arehman@dev</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#64748b">$</tspan> <tspan fill="#f1f5f9" font-weight="600">whoami</tspan>
    </text>

    <!-- Output 1 -->
    <text x="0" y="34" class="mono" font-size="16px" fill="#f8fafc" font-weight="600" letter-spacing="-0.3px">
      Abdul Rehman <tspan fill="#64748b" font-weight="400" font-size="14px">— Software Developer</tspan>
    </text>

    <!-- Command 2: cat stack.txt -->
    <text x="0" y="92" class="mono" font-size="15px">
      <tspan fill="#10b981" font-weight="700">arehman@dev</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#64748b">$</tspan> <tspan fill="#f1f5f9" font-weight="600">cat stack.txt</tspan>
    </text>

    <!-- Output 2: 4 Pillars with subtle separators -->
    <g transform="translate(0, 126)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="82" height="26" rx="5" fill="#09131d" stroke="#10b981" stroke-width="0.8" />
      <text x="41" y="17" text-anchor="middle" class="mono" font-size="12px" fill="#34d399" font-weight="600">Python</text>

      <!-- Pill 2 -->
      <rect x="94" y="0" width="130" height="26" rx="5" fill="#09131d" stroke="#1e293b" stroke-width="0.8" />
      <text x="159" y="17" text-anchor="middle" class="mono" font-size="12px" fill="#94a3b8" font-weight="500">Linux &amp; RHEL</text>

      <!-- Pill 3 -->
      <rect x="236" y="0" width="115" height="26" rx="5" fill="#09131d" stroke="#1e293b" stroke-width="0.8" />
      <text x="293" y="17" text-anchor="middle" class="mono" font-size="12px" fill="#94a3b8" font-weight="500">Applied AI</text>

      <!-- Pill 4 -->
      <rect x="363" y="0" width="120" height="26" rx="5" fill="#09131d" stroke="#1e293b" stroke-width="0.8" />
      <text x="423" y="17" text-anchor="middle" class="mono" font-size="12px" fill="#94a3b8" font-weight="500">Modern C++</text>
    </g>

    <!-- Command 3: Active cursor -->
    <text x="0" y="196" class="mono" font-size="15px">
      <tspan fill="#10b981" font-weight="700">arehman@dev</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#64748b">$</tspan>
    </text>
    <rect x="155" y="182" width="9" height="17" class="cursor" />
  </g>

  <!-- Vertical Divider Line (Subtle) -->
  <line x1="680" y1="80" x2="680" y2="330" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 5" opacity="0.4" />

  <!-- ==================== RIGHT: MINIMALIST GEOMETRIC CIRCUIT ==================== -->
  <g transform="translate(710, 80)">

    <!-- Geometric Ambient Lines -->
    <g stroke="#1e293b" stroke-width="1" opacity="0.6">
      <circle cx="230" cy="130" r="110" fill="none" stroke-dasharray="2 6" />
      <circle cx="230" cy="130" r="75" fill="none" opacity="0.4" />
    </g>

    <!-- Animated Data Flow Lines -->
    <path d="M 120 130 L 230 130 L 340 70" fill="none" stroke="#10b981" stroke-width="1.4" class="flow-line" opacity="0.75" />
    <path d="M 230 130 L 340 190" fill="none" stroke="#38bdf8" stroke-width="1.4" class="flow-line" opacity="0.75" />

    <!-- Core Central Node -->
    <g transform="translate(230, 130)">
      <circle cx="0" cy="0" r="28" fill="#020817" stroke="#10b981" stroke-width="1.5" />
      <circle cx="0" cy="0" r="14" fill="#064e3b" opacity="0.6" />
      <circle cx="0" cy="0" r="5" fill="#10b981" filter="url(#emerald-glow)" class="pulse-core" />
      
      <!-- Label below -->
      <rect x="-48" y="38" width="96" height="20" rx="4" fill="#080d1a" stroke="#10b981" stroke-width="0.8" />
      <text x="0" y="52" text-anchor="middle" class="mono" font-size="10px" fill="#10b981" font-weight="600">CORE NODE</text>
    </g>

    <!-- Node Top Right: Systems -->
    <g transform="translate(340, 70)">
      <circle cx="0" cy="0" r="18" fill="#020817" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#subtle-glow)" />
      <text x="28" y="4" class="mono" font-size="11px" fill="#94a3b8" font-weight="500">SYSTEMS</text>
    </g>

    <!-- Node Bottom Right: Backends -->
    <g transform="translate(340, 190)">
      <circle cx="0" cy="0" r="18" fill="#020817" stroke="#10b981" stroke-width="1.2" />
      <circle cx="0" cy="0" r="4" fill="#10b981" filter="url(#subtle-glow)" />
      <text x="28" y="4" class="mono" font-size="11px" fill="#94a3b8" font-weight="500">AUTOMATION</text>
    </g>

    <!-- Node Left: Intelligence / Vision -->
    <g transform="translate(120, 130)">
      <circle cx="0" cy="0" r="18" fill="#020817" stroke="#64748b" stroke-width="1.2" />
      <circle cx="0" cy="0" r="4" fill="#f59e0b" filter="url(#subtle-glow)" />
      <text x="-28" y="4" text-anchor="end" class="mono" font-size="11px" fill="#94a3b8" font-weight="500">INTELLIGENCE</text>
    </g>

  </g>
</svg>